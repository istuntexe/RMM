name: Validate and build agent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Integration tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Agent process smoke test
        run: python scripts/smoke-agent.py python agent.py
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Test dashboard in Chromium
        run: python scripts/verify-dashboard.py
      - name: Upload dashboard screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: build/ui/*.png
          if-no-files-found: error
  windows-agent:
    needs: [test, dashboard]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test Windows executable
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload unsigned executable and checksum
        uses: actions/upload-artifact@v4
        with:
          name: hybridrmm-agent-windows-x64-unsigned
          path: |
            dist/hybridrmm-agent.exe
            dist/SHA256SUMS.txt
            dist/build-info.json
          if-no-files-found: error
          retention-days: 14
