<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RMM inventory</title>
<style>*{box-sizing:border-box}body{font:16px system-ui;background:#101827;color:#e6edf7;max-width:1100px;margin:60px auto;padding:20px}input,button{font:inherit;padding:10px;margin:6px 0}table{width:100%;border-collapse:collapse;margin-top:24px}th,td{text-align:left;padding:14px;border-bottom:1px solid #334155}p{color:#b5c4d9}input{max-width:100%}.table-scroll{overflow-x:auto;width:100%}table{min-width:540px}@media(max-width:600px){body{margin:20px auto}label{display:block}input{display:block;width:100%}}
</style>
<h1>Device inventory</h1><p>Enrolled devices and their latest health check. The admin token stays in this page’s memory until it is closed.</p>
<p><a href="/share" style="color:#b7d7ff">Share this device’s screen with consent</a></p>
<form id="login"><label>Admin token <input id="token" type="password" required autocomplete="off"></label> <button>Refresh devices</button></form><p id="status" role="status">Enter your admin token to load inventory.</p>
<div class="table-scroll" role="region" aria-label="Device inventory" tabindex="0"><table><thead><tr><th>Device</th><th>OS</th><th>Architecture</th><th>Last seen</th><th>Status</th><th>Support</th></tr></thead><tbody id="devices"></tbody></table></div>
<script>
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('#status');try{const response=await fetch('/api/devices',{headers:{Authorization:'Bearer '+document.querySelector('#token').value}});if(!response.ok)throw Error(response.status===401?'Authentication failed':'Could not load devices');const data=await response.json();const rows=document.querySelector('#devices');rows.replaceChildren();for(const device of data.devices){const row=document.createElement('tr');for(const value of [device.inventory.hostname,device.inventory.os+' '+device.inventory.release,device.inventory.architecture,new Date(device.last_seen*1000).toLocaleString(),device.online?'Online':'Offline']){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}const support=document.createElement('td');const link=document.createElement('a');link.href='/viewer#'+encodeURIComponent(device.id);link.textContent='View screen';link.style.color='#b7d7ff';support.append(link);row.append(support);rows.append(row)}status.textContent=data.devices.length+' enrolled device(s)'}catch(error){document.querySelector('#devices').replaceChildren();status.textContent=error.message}});
</script></html>
