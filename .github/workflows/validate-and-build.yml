name: Validate and build agent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install signaling dependency
        run: python -m pip install -r requirements-signaling.txt
      - name: Integration tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Agent process smoke test
        run: python scripts/smoke-agent.py python agent.py
  dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.58.0 -r requirements-signaling.txt
          python -m playwright install --with-deps chromium
      - name: Install local TURN test relay
        run: sudo apt-get update && sudo apt-get install -y coturn
      - name: Test dashboard in Chromium
        run: |
          python scripts/verify-dashboard.py
          python scripts/verify-support.py
      - name: Upload dashboard screenshots
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: build/ui/*.png
          if-no-files-found: error
  native-agent:
    needs: [test, dashboard]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native-agent/go.sum
      - name: Install server test dependency
        run: python -m pip install -r requirements-signaling.txt
      - name: Build and test native agent
        run: python scripts/build-native.py
      - name: Native Linux process test
        if: runner.os == 'Linux'
        run: python scripts/smoke-native-agent.py build/hybridrmm-agent
      - name: Native Windows process test
        if: runner.os == 'Windows'
        run: python scripts/smoke-native-agent.py agent-binaries/windows-amd64/hybridrmm-agent.exe
      - name: Windows installation, service and uninstall test
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-service.ps1
      - name: Record successful Windows runtime checks
        if: runner.os == 'Windows'
        run: >-
          python -c "import json,pathlib; p=pathlib.Path('agent-binaries/windows-amd64/build-info.json'); d=json.loads(p.read_text()); d['windows_runtime_tested']=True; p.write_text(json.dumps(d,indent=2))"
      - name: Upload unsigned native Windows agent
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: hybridrmm-native-windows-x64-unsigned
          path: agent-binaries/windows-amd64/*
          if-no-files-found: error
          retention-days: 14
